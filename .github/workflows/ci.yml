name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Separate from the job below because it needs none of the dependencies:
  # ruff-action fetches a standalone binary, so this reports in seconds rather
  # than after an 8 GB install.
  ruff:
    name: "Ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Ruff Check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.5"
          src: "."
          args: "check --no-fix"

      - name: Ruff Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.5"
          src: "."
          args: "format --check"

  # ty and pytest share a job because they need the same ~8 GB of dependencies
  # and a hosted runner would otherwise install them twice.
  checks:
    name: "Type check and tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      # torch, the NVIDIA CUDA wheels and TensorRT come to roughly 8 GB, against
      # a hosted runner that starts with about half that free. Removing
      # toolchains this job will never use buys back ~25 GB. Inline rather than
      # via a third-party action so no new code is trusted with the runner.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@28f2168f4d98ee0445e3c6321f6e6616c83dd5ec
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/requirements_dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements/requirements_dev.txt
          # No --plugins: the nvcc-built extension is opt-in and this runner has
          # no CUDA toolkit. That this install works at all without one is what
          # setup.py's lazy make_plugins_ext_module() exists for, and is exactly
          # what would regress silently without a job like this.
          .venv/bin/python -m pip install --no-build-isolation .

      - name: Run ty
        shell: bash
        run: .venv/bin/ty check

      # There is no GPU here, so the tests that build TensorRT engines skip.
      # -ra prints the skip reasons, which is how a suite that quietly stopped
      # running anything gets noticed. The 11 that do run are the pure-Python
      # ones: the flattener, the dataset containers, version parsing.
      - name: Run tests
        shell: bash
        run: .venv/bin/python -m pytest tests -v -ra
