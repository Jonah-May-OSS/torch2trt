name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-timeout pytest-xdist pytest-cov
        
    - name: Install PyTorch and torchvision (CPU)
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
    - name: Install other dependencies
      run: |
        pip install timm
        
    - name: Install torch2trt
      run: |
        pip install -e .
        
    - name: Run tests (CPU only - limited tests)
      run: |
        # Only run tests that don't require CUDA/TensorRT
        pytest tests/feature_tests/test_version_utils.py -v
        pytest tests/feature_tests/test_flattener.py -v
        pytest tests/feature_tests/test_dataset.py -v
      continue-on-error: true
      
    - name: Display test summary
      if: always()
      run: |
        echo "Test run completed. Note: Most tests require CUDA/TensorRT and cannot run in this CPU-only environment."
        echo "For full test coverage, tests should be run on a system with NVIDIA GPU and TensorRT installed."
