[pytest]
# pytest configuration for torch2trt

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    converter: Tests for individual converter functions
    feature: Tests for torch2trt features
    model: Tests for full model conversion
    slow: Tests that take a long time to run
    gpu: Tests that require GPU
    
# Minimum version
minversion = 6.0

# Console output options
console_output_style = progress

# Test timeout (in seconds)
timeout = 300
