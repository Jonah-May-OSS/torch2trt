# Mirrors wyoming-whisper-trt's ruff policy so both repos lint alike.
# Standalone rather than pyproject.toml: this project builds via setup.py and a
# CUDAExtension, and introducing a pyproject.toml would switch pip to PEP 517.
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "Q",      # flake8-quotes
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by the formatter)
]

[lint.per-file-ignores]
"tests/*" = ["D", "ARG"]
"examples/*" = ["D", "ARG"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
