# Ruff configuration for torch2trt
# See: https://docs.astral.sh/ruff/configuration/

# Target Python 3.8+
target-version = "py38"

# Line length
line-length = 100

[lint]
# Enable pycodestyle (E), pyflakes (F), and isort (I) rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# Ignore specific rules that may be too strict for existing code
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports and star imports in __init__.py
"torch2trt/converters/__init__.py" = ["F401", "F403", "I001"]  # Allow unused imports, star imports, and unsorted imports (import order matters!)
"torch2trt/converters/*.py" = ["F403", "F405"]  # Allow star imports in converters
"torch2trt/contrib/**/*.py" = ["F403", "F405", "N999", "N802", "N812", "N817"]  # Allow star imports, module names, and naming conventions in contrib

[format]
# Use single quotes
quote-style = "single"

# Indent with 4 spaces
indent-style = "space"

# Respect magic trailing comma
skip-magic-trailing-comma = false
