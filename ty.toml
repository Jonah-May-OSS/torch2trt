# Type-check the library and its tests; examples, scripts and the generated
# build tree are not part of the shipped package.
[src]
include = ["torch2trt", "tests"]
exclude = [
    "build",
    "examples",
    "scripts",
    "**/__pycache__",
    # contrib is not part of the default install (setup.py excludes it unless
    # --contrib is passed) and its QAT layers import pytorch_quantization and
    # absl, neither a dependency of this package nor installed in the checked
    # environment. Checking it would report on code that does not ship.
    "torch2trt/contrib",
    # Optional visualisation helper; graphviz is not a runtime dependency and
    # is not installed in the checked environment.
    "torch2trt/utils.py",
]

[environment]
python-version = "3.12"

[rules]
# TensorRT's Python module resolves its attributes lazily at import time, so no
# static checker can see trt.ActivationType, trt.PoolingType, trt.int8 and the
# rest. This is the same call the project already made for pylint, which carried
#     ignored-modules=tensorrt
# with the same reasoning. 217 of the 223 reports under this rule were that; the
# remaining 6 were real and are fixed rather than hidden.
unresolved-attribute = "ignore"
